name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Website File Integrity
        run: |
          echo "Verifying presence of core website files..."
          for file in \
            website/index.html \
            website/downloads.html \
            website/docs.html \
            website/security.html \
            website/privacy.html \
            website/terms.html \
            website/about.html \
            website/roadmap.html \
            website/404.html \
            website/robots.txt \
            website/sitemap.xml \
            website/assets/css/style.css \
            website/assets/js/main.js \
            website/assets/js/downloads.js \
            website/assets/data/releases.json
          do
            if [ ! -f "$file" ]; then
              echo "Error: Required file missing: $file"
              exit 1
            fi
          done
          echo "All required website files are present."

      - name: Validate Release Data JSON Schema
        run: |
          python3 -c "import json; data=json.load(open('website/assets/data/releases.json')); assert data['version'] == '0.3.1'; print(f'Validated releases.json: {len(data[\"packages\"])} packages found.')"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
