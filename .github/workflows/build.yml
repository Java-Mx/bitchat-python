name: Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build: uv build
        run: uv build

      - name: Verify wheel/sdist created
        run: |
          ls -la dist/
          uv run python -c "
          import glob, sys
          wheels = glob.glob('dist/*.whl')
          sdists = glob.glob('dist/*.tar.gz')
          if not wheels:
              sys.exit('Verification failed: No .whl wheel file found in dist/')
          if not sdists:
              sys.exit('Verification failed: No .tar.gz source distribution file found in dist/')
          print(f'Build verification succeeded: found {len(wheels)} wheel(s) and {len(sdists)} sdist(s).')
          for artifact in wheels + sdists:
              print(f'  - {artifact}')
          "

  package-windows:
    name: Build & Validate Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "ISCC already available on PATH."
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install innosetup --no-progress
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run Packaging Unit Tests
        run: uv run pytest tests/unit/test_packaging_windows.py tests/unit/test_package.py

      - name: Build Windows Distributable & WinGet Manifests
        shell: pwsh
        run: uv run python packaging/windows/build.py

      - name: Verify Packaging Artifacts
        shell: pwsh
        run: |
          $version = (Get-Content pyproject.toml | Select-String '^version = "(.*)"').Matches.Groups[1].Value
          $installer = "dist/BitChat-$version-windows-x64.exe"
          $shaFile = "dist/BitChat-$version-windows-x64.exe.sha256"
          if (-not (Test-Path $installer)) { throw "Expected installer $installer was not created!" }
          if (-not (Test-Path $shaFile)) { throw "Expected checksum file $shaFile was not created!" }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          $recordedHash = (Get-Content $shaFile).Split(' ')[0].Trim()
          if ($hash -ne $recordedHash) { throw "Installer SHA-256 mismatch: $hash vs $recordedHash" }
          Write-Host "Verification succeeded for $installer ($hash)"

      - name: Upload Windows Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-distributable
          path: |
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            manifests/
            packaging/windows/winget/

  package-linux:
    name: Build & Validate Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dpkg-dev flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Run Ruff Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pyright Type Checking
        run: uv run pyright

      - name: Run Packaging Unit Tests
        run: uv run pytest tests/unit/test_packaging_linux.py tests/unit/test_package.py

      - name: Build Linux Distributables (.deb, AppImage & Flatpak)
        run: uv run python packaging/linux/build.py --build-flatpak

      - name: Verify Linux Packaging Artifacts
        run: |
          version=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
          deb_file="dist/bitchat_${version}_amd64.deb"
          appimage_file="dist/BitChat-${version}-x86_64.AppImage"
          flatpak_bundle="dist/io.github.java_mx.bitchat.flatpak"
          
          if [ ! -f "$deb_file" ]; then
            echo "Expected .deb package $deb_file not found!" >&2
            exit 1
          fi
          if [ ! -f "$appimage_file" ]; then
            echo "Expected AppImage $appimage_file not found!" >&2
            exit 1
          fi
          
          # Test .deb installation and uninstallation
          echo "Testing .deb installation..."
          sudo dpkg -i "$deb_file"
          which bitchat
          bitchat --version
          bitchat --help
          bitchat --configure
          sudo dpkg -r bitchat
          
          # Test AppImage execution
          echo "Testing AppImage execution..."
          chmod +x "$appimage_file"
          ./"$appimage_file" --version
          ./"$appimage_file" --help
          ./"$appimage_file" --configure
          
          # Test Flatpak execution if bundle was created
          if [ -f "$flatpak_bundle" ]; then
            echo "Testing Flatpak bundle installation and execution..."
            flatpak install --user -y "$flatpak_bundle"
            flatpak run io.github.java_mx.bitchat --version
            flatpak run io.github.java_mx.bitchat --help
            flatpak uninstall --user -y io.github.java_mx.bitchat
          fi
          
          echo "Linux artifact validation succeeded!"

      - name: Upload Linux Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-distributables
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*-x86_64.AppImage
            dist/*-x86_64.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
            packaging/linux/flatpak/

