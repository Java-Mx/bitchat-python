name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Run Quality Checks (ruff check & format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Type Checking (pyright)
        run: uv run pyright

      - name: Run Test Suite (pytest)
        run: uv run pytest

      - name: Build Python Packages (Wheel & sdist)
        run: uv build

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "ISCC is already on PATH."
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install innosetup --no-progress
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows Distributable & WinGet Manifests
        shell: pwsh
        run: uv run python packaging/windows/build.py

      - name: Code Signing (Optional hook if certificate secrets provided)
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASS: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ($env:CERT_DATA) {
            Write-Host "Signing certificate found in secrets. Signing installer..."
            $pfxPath = "$env:TEMP\signing_cert.pfx"
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CERT_DATA))
            $installer = Get-Item dist/BitChat-*-windows-x64.exe
            & signtool sign /f $pfxPath /p $env:CERT_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
            Remove-Item $pfxPath -Force
            # Re-generate SHA-256 and update manifests after signing
            uv run python packaging/windows/build.py --skip-pyinstaller --skip-installer
          } else {
            Write-Host "No Windows code signing certificate configured (secrets.WINDOWS_SIGNING_CERT not set)."
            Write-Host "Installer is compiled unsigned. Users may observe Windows SmartScreen prompts."
          }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            packaging/windows/winget/Java-Mx.BitChat.yaml

      - name: Submit to Microsoft winget-pkgs (Optional automated submission)
        uses: vedantmgoyal2009/winget-releaser@v2
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.WINGET_TOKEN != ''
        with:
          identifier: Java-Mx.BitChat
          installers-regex: 'BitChat-.*-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
