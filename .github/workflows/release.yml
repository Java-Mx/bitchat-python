name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Distributables (.deb & AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev dpkg-dev flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Run Quality Checks (ruff check & format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Type Checking (pyright)
        run: uv run pyright

      - name: Run Test Suite (pytest)
        run: uv run pytest

      - name: Build Python Packages (Wheel & sdist)
        run: uv build

      - name: Build Linux Distributables (.deb, AppImage & Flatpak)
        run: uv run python packaging/linux/build.py --build-flatpak

      - name: Upload Linux Distributables
        uses: actions/upload-artifact@v4
        with:
          name: linux-distributables
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.deb.sha256
            dist/*-x86_64.AppImage
            dist/*-x86_64.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256

  build-windows:
    name: Build Windows Distributables (.exe & WinGet)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (uv sync --all-groups)
        run: uv sync --all-groups

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "ISCC is already on PATH."
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install innosetup --no-progress
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Windows Distributable & WinGet Manifests
        shell: pwsh
        run: uv run python packaging/windows/build.py

      - name: Code Signing (Optional hook if certificate secrets provided)
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASS: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ($env:CERT_DATA) {
            Write-Host "Signing certificate found in secrets. Signing installer..."
            $pfxPath = "$env:TEMP\signing_cert.pfx"
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CERT_DATA))
            $installer = Get-Item dist/BitChat-*-windows-x64.exe
            & signtool sign /f $pfxPath /p $env:CERT_PASS /tr http://timestamp.digicert.com /td sha256 /fd sha256 $installer.FullName
            Remove-Item $pfxPath -Force
            # Re-generate SHA-256 and update manifests after signing
            uv run python packaging/windows/build.py --skip-pyinstaller --skip-installer
          } else {
            Write-Host "No Windows code signing certificate configured (secrets.WINDOWS_SIGNING_CERT not set)."
            Write-Host "Installer is compiled unsigned. Users may observe Windows SmartScreen prompts."
          }

      - name: Upload Windows Distributables
        uses: actions/upload-artifact@v4
        with:
          name: windows-distributables
          path: |
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            packaging/windows/winget/Java-Mx.BitChat.yaml

  publish:
    name: Publish GitHub Release & WinGet
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux Distributables
        uses: actions/download-artifact@v4
        with:
          name: linux-distributables
          path: dist/

      - name: Download Windows Distributables
        uses: actions/download-artifact@v4
        with:
          name: windows-distributables
          path: dist-win/

      - name: Organize Artifacts
        run: |
          mkdir -p packaging/windows/winget/
          cp -r dist-win/BitChat* dist/ 2>/dev/null || true
          if [ -f dist-win/packaging/windows/winget/Java-Mx.BitChat.yaml ]; then
            cp dist-win/packaging/windows/winget/Java-Mx.BitChat.yaml packaging/windows/winget/
          elif [ -f dist-win/Java-Mx.BitChat.yaml ]; then
            cp dist-win/Java-Mx.BitChat.yaml packaging/windows/winget/
          fi
          ls -la dist/

      - name: Create GitHub Release & Upload All Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/BitChat-*-windows-x64.exe
            dist/BitChat-*-windows-x64.exe.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*-x86_64.AppImage
            dist/*-x86_64.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
            packaging/windows/winget/Java-Mx.BitChat.yaml

      - name: Submit to Microsoft winget-pkgs (Optional automated submission)
        uses: vedantmgoyal2009/winget-releaser@v2
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.WINGET_TOKEN != ''
        with:
          identifier: Java-Mx.BitChat
          installers-regex: 'BitChat-.*-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
