app-id: io.github.java_mx.bitchat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: bitchat

finish-args:
  # Network access: required for LAN UDP discovery (port 24024) and TCP direct messaging (port 24025)
  - --share=network
  # System D-Bus access: required for BlueZ daemon communication (BLE scanning, advertising, GATT)
  - --system-talk-name=org.bluez

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: bitchat
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/bitchat /app/bin
      - cp -a dist/bitchat/. /app/lib/bitchat/
      - ln -sf /app/lib/bitchat/bitchat /app/bin/bitchat
      - install -Dm644 packaging/linux/flatpak/io.github.java_mx.bitchat.desktop /app/share/applications/io.github.java_mx.bitchat.desktop
      - install -Dm644 packaging/linux/flatpak/io.github.java_mx.bitchat.metainfo.xml /app/share/metainfo/io.github.java_mx.bitchat.metainfo.xml
    sources:
      - type: dir
        path: ../../../
