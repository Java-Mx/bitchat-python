<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" style="background:#090d14; border-radius:8px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
  <defs>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Peers Columns -->
  <!-- Peer A (Initiator) -->
  <rect x="80" y="30" width="200" height="44" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="180" y="52" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">PEER A (Initiator)</text>
  <text x="180" y="66" fill="#94a3b8" font-size="10" text-anchor="middle">Local Identity: Ed25519</text>
  <line x1="180" y1="74" x2="180" y2="340" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Peer B (Responder) -->
  <rect x="680" y="30" width="200" height="44" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="780" y="52" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">PEER B (Responder)</text>
  <text x="780" y="66" fill="#94a3b8" font-size="10" text-anchor="middle">Local Identity: Ed25519</text>
  <line x1="780" y1="74" x2="780" y2="340" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Noise XX Handshake Step 1 -->
  <path d="M 180 115 L 770 115" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="330" y="95" width="300" height="38" rx="4" fill="#0b1120" stroke="#1e293b"/>
  <text x="480" y="112" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">1. -> e (Ephemeral Key Exchange)</text>
  <text x="480" y="126" fill="#94a3b8" font-size="10" text-anchor="middle">Peer A sends ephemeral public key (X25519)</text>

  <!-- Noise XX Handshake Step 2 -->
  <path d="M 780 175 L 190 175" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="300" y="155" width="360" height="38" rx="4" fill="#0b1120" stroke="#1e293b"/>
  <text x="480" y="172" fill="#fdba74" font-size="11" font-weight="600" text-anchor="middle">2. &lt;- e, ee, s, es (Responder Auth &amp; Session)</text>
  <text x="480" y="186" fill="#94a3b8" font-size="10" text-anchor="middle">Peer B sends ephemeral key, static key, encrypted identity</text>

  <!-- Noise XX Handshake Step 3 -->
  <path d="M 180 235 L 770 235" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <rect x="310" y="215" width="340" height="38" rx="4" fill="#0b1120" stroke="#1e293b"/>
  <text x="480" y="232" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">3. -> s, se (Initiator Mutual Authentication)</text>
  <text x="480" y="246" fill="#94a3b8" font-size="10" text-anchor="middle">Peer A encrypts static key; mutual trust established</text>

  <!-- Established Secure Channel -->
  <rect x="140" y="275" width="680" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2" fill-opacity="0.3"/>
  <text x="480" y="297" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">ESTABLISHED SECURE CHANNEL: ChaCha20-Poly1305 + BLAKE2s</text>
  <text x="480" y="315" fill="#a7f3d0" font-size="10" text-anchor="middle">Forward Secrecy Verified  *  RAM-Only Session Keys  *  Replay Protected via Rust NativePacketDeduplicator</text>
</svg>
